services:
  - type: web
    name: n8n-etsyboostai
    # Jala la imagen directamente desde Docker Hub — sin build, sin layer lock
    env: image
    image:
      url: docker.io/n8nio/n8n:latest
    # Render inyecta $PORT en runtime; n8n lo lee via N8N_PORT
    startCommand: sh -c "N8N_PORT=${PORT:-5678} n8n start"
    plan: free
    healthCheckPath: /healthz

    envVars:
      - key: N8N_HOST
        value: n8n-etsyboostai.onrender.com
      - key: N8N_WEBHOOK_URL
        value: https://n8n-etsyboostai.onrender.com/
      - key: N8N_PROTOCOL
        value: https
      - key: N8N_ENCRYPTION_KEY
        generateValue: true
      - key: N8N_SECURE_COOKIE
        value: "false"
      - key: GENERIC_TIMEZONE
        value: America/Santiago
      - key: TZ
        value: America/Santiago
      - key: DB_TYPE
        value: sqlite
      - key: N8N_LOG_LEVEL
        value: info